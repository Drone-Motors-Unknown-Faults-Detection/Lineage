[build-system]
requires = ["setuptools>=79,<80", "wheel>=0.45,<0.46"]
build-backend = "setuptools.build_meta"

[project]
name = "lineage"
version = "0.2.0"
requires-python = ">=3.10,<3.11"
# 冷啟動 PHM 專題（core / experiments / web）的依賴——不需要 TensorFlow 與 GPU
dependencies = [
    "numpy>=2.2,<2.3",
    "pandas>=2.3,<2.4",
    "matplotlib>=3.10,<3.11",
    "scipy>=1.15,<1.16",
    "scikit-learn>=1.7,<1.8",
    "hdbscan>=0.8.44,<0.9",
    "loguru>=0.7.3,<0.8",
    "tornado>=6.5,<6.6",
]

[project.optional-dependencies]
# CI 與本機跑 tests/、ruff 用；正式執行期不需要
test = [
    "pytest>=9.1,<10",
    "ruff>=0.16,<0.17",
]
# 重跑論文版管線（Ancestor repo）才需要的額外套件：
#   ./build_uv.sh --legacy    （Linux, GPU）
legacy-linux = [
    "tensorflow[and-cuda]",
    "jupyter",
    "seaborn",
    "natsort",
    "absl-py",
    "markdown",
]
legacy-mac = [
    "tensorflow==2.18.0",
    "tensorflow-metal==1.2.0",
    "jupyter",
    "seaborn",
    "natsort",
    "absl-py",
    "markdown",
]

[tool.setuptools]
packages = ["core", "experiments", "experiments.health", "web"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["venv", ".venv310", "data"]

[tool.ruff.lint]
# 明確鎖定規則集合：跨 ruff 版本穩定，不隨其「預設集合」改版變動。
select = ["E4", "E7", "E9", "F"]
