[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "lineage"
version = "0.2.0"
requires-python = "==3.10.19"
# 冷啟動 PHM 專題（core / experiments / web）的依賴——不需要 TensorFlow 與 GPU
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "scikit-learn",
    "hdbscan",
    "loguru",
    "tornado",
]

[project.optional-dependencies]
# 重跑論文版管線（Ancestor repo）才需要的額外套件：
#   ./build_uv.sh --legacy    （Linux, GPU）
legacy-linux = [
    "tensorflow[and-cuda]",
    "jupyter",
    "seaborn",
    "natsort",
    "absl-py",
    "markdown",
]
legacy-mac = [
    "tensorflow==2.18.0",
    "tensorflow-metal==1.2.0",
    "jupyter",
    "seaborn",
    "natsort",
    "absl-py",
    "markdown",
]

[tool.setuptools]
packages = ["core", "experiments", "web"]