name: CI Standard Testing Procedure

on: [push, pull_request]

permissions:
  contents: read

jobs:
  contracts:
    name: CPython 3.10 / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: 讀取完整歷史供固定基線測試
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 設定 Python 與只含套件的下載快取
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: runtime-constraints.txt
      - name: 依單一 constraints 建立新環境
        run: |
          python -m venv .venv310
          VENV_BIN="$PWD/.venv310/bin"
          "$VENV_BIN/python" -m pip install -c runtime-constraints.txt pip setuptools wheel
          "$VENV_BIN/python" -m pip install --no-build-isolation -c runtime-constraints.txt .
          "$VENV_BIN/python" -m pip install -c runtime-constraints.txt pytest
          echo "$VENV_BIN" >> "$GITHUB_PATH"
      - name: 套件、完整 pytest、CLI 與文件目標
        run: python -m tests.ci_evidence
      - name: 成功或失敗均只保存去敏摘要
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 去敏契約結果-ubuntu-latest-3.10
          path: output/ci_evidence/*/public_summary.json
          if-no-files-found: warn
          retention-days: 14