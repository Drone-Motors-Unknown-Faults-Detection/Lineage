name: CI Standard Testing Procedure

on: [push, pull_request]

permissions:
  contents: read

jobs:
  contracts:
    name: CPython 3.10 / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: 讀取完整歷史供固定基線測試
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 安裝 uv（環境與套件管理工具）
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: runtime-constraints.txt
      - name: 依單一 constraints 建立新環境
        run: |
          uv python install 3.10
          uv venv --seed --python 3.10 .venv310
          VENV_BIN="$PWD/.venv310/bin"
          uv pip install --python "$VENV_BIN/python" -c runtime-constraints.txt pip setuptools wheel
          uv pip install --python "$VENV_BIN/python" --no-build-isolation -c runtime-constraints.txt .
          uv pip install --python "$VENV_BIN/python" -c runtime-constraints.txt pytest ruff
          echo "$VENV_BIN" >> "$GITHUB_PATH"
      - name: 套件、ruff、完整 pytest、CLI 與文件目標
        run: python -m tests.ci_evidence
      - name: 成功或失敗均只保存去敏摘要
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 去敏契約結果-ubuntu-latest-3.10
          path: output/ci_evidence/*/public_summary.json
          if-no-files-found: warn
          retention-days: 14